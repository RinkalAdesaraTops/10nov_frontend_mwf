<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a=45
        let b=25
        let ch=3
        document.write('<br>1.Addition')
        document.write('<br>2.Minus')
        document.write('<br>3.Multiply')
        document.write('<br>4.Division')
        switch(ch){
            case 1:document.write('<br>Addition is '+(a+b))
                    break
            case 2:document.write('<br>Minus is '+(a-b))
                    break
            case 3:document.write('<br>Multiply is '+(a*b))
                    break
            case 4:document.write('<br>Division is '+(a/b))
                    break
            default: document.write('<br>Invalid choice...')
                     break
        }
    </script>
</body>
</html>
