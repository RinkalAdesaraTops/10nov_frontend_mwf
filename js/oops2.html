<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        class emp{
            // parameterized constructor
            constructor(p,q){ //special member function
                document.write('<br>Constructor called..')
                this.a=p
                this.b=q
            }
            add(){ //member function - normal function 
                document.write('<br>Addition is '+(this.a + this.b))
            }
        }
        let obj = new emp(11,22)
        obj.add()
    </script>
</body>
</html>
