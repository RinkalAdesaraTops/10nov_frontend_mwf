<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // inheritance = reusuablity = parent-child concept
        class parent {
            constructor() {
                document.write('<br>Parent class constructor called..')
                this.a=25
                this.b=20
            }
            add(){
                document.write('<br>Addition is '+(this.a+this.b))
            }
        }
        class child extends parent {
            constructor() {
                super()
                document.write('<br>Child class constructor called..')
                this.a=55
                this.b=15
            }
            minus(){
                document.write('<br>Minus is '+(this.a-this.b))
            }
        }
        let a1 = new child()
        a1.add()
        a1.minus()
    </script>
</body>

</html>
