<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // while,do_while & for loop
        let i=1
        while(i<=5){ //1<=5 entry controlled
            document.write('<br> i is '+i) //1
            i++ //i+=1
        }
        document.write('<br><hr>')
        let j=10
        do{ //exit controlled loop
            document.write('<br> j is '+j)
            j--
        } while(j>=1);
    </script>
</body>
</html>
