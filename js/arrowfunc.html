<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let add = () => {
            let a = 20
            let b = 15
            document.write('<br>Addition is ' + (a + b))
        }
        //fat arrow function
        const mult = (a,b)=> document.write('<br>Multiplication is '+(a*b))
        const pi=3.14
        let r=20
        const area = ()=> pi*r**2
        var cube = a => a**3       
        add()
        mult(45,2)
        document.write('<br>Area of circle is '+area())
        document.write('<br>Cube is '+cube(5))
    </script>
</body>

</html>
