<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // variables
        // 1)nothing
        a = 25
        b = 10
        c = a + b
        // document.write("Addition is ",c)
        document.write("Addition is " + (a + b))
        // 2)var keyword - redeclare & reassign is possible
        var x = "hi"
        document.write('<br>' + x)
        var x = 2567
        document.write('<br>' + x)
        // 3)const keyword - cant redeclare & reassign
        const pi = 3.14
        var r = 2.5
        document.write('<br>Area of circle is ' + (pi * r * r))
        //4)let keyword = cant redeclare but reassign is possible
        let p = 56
        document.write('<br>' + p)
        p = 4658
        document.write('<br>' + p)
    </script>
</body>

</html>
