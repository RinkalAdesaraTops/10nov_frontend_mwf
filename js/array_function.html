<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // let a = ["xct","abc","jkl"]
        let a= [67,7,90,100,12,89]
        //compare function
        // document.write('<br>'+a.sort())
        document.write('<br>'+a.sort((a,b)=>{
                    return b-a //67-7=60 67-90=-
                    // return a-b //67-7=60 67-90=-
        }))
        document.write('<br>'+a.reverse())
        //searching & then return boolean value= true,false
        let ans = a.includes(900)
        document.write('<br>'+ans)
        // for(var x in a){
        //     console.log(a[x]);          
        // }
        for(var x of a){
            // console.log(x);          
        }
        //map function
        let res = a.map((i,index)=>{
                return i*2
        })
        document.write('<br>'+res)
        //searching & return only single value
        res = a.find((i,index)=>{
                return i==100
        })
        console.log(res);
        //searching & return array
        res = a.filter((i,index)=>{
                return i==100
        })
        console.log(res);
    </script>
</body>
</html>
