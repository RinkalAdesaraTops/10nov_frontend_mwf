<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="demo">Hello</div>
    <span id="hr">00</span> :
    <span id="min">00</span> :
    <span id="count">00</span>
    <script>
        setTimeout(()=>{
            document.getElementById('demo').innerHTML = "<b>Good Morning</b>"
        },3000)
        let c=0
        let m=0
        setInterval(()=>{
            c+=1
            document.getElementById('count').innerHTML = c
            if(c>=10){
                m++
                document.getElementById('min').innerHTML = m
                c=0
            }
        },1000)
        let arr = [110,22,30,450,66]
        // or 
        let res = arr.some((i)=>{
            return i%2==0
        })
        document.write('<br>'+res)
        // and
        res = arr.every((i)=>{
            return i%2==0
        })
        document.write('<br>'+res)
    </script>
</body>
</html>
