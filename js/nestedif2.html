<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //max from 4 - a b c d
        let a=35
        let b=6
        let c=45
        //a b c
        if(a>b){
            if(a>c){
                document.write('<br>A is maximum')
            } else {
                document.write('<br>C is maximum')
            }
        } else {
            if(b>c){
                document.write('<br>B is maximum')
            } else {
                document.write('<br>C is maximum')
            }
        }
    </script>
</body>
</html>
