<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let no=45
        if(no>0){
            document.write('<br>It is +ve no')
        } else if(no==0){ //no<0 - negative
            document.write('<br>It is zero')
        } else {
            document.write('<br>it is -ve no')
        }
    </script>
</body>
</html>
