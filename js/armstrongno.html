<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 153 = 1^3 +  5^3 + 3^3
            //   1 +125+27=153
        let no=153
        let sum=0
        let n=no
        while(no>0){
            let r=no%10
            no = Math.floor(no/10)
            sum = sum +(r**3)
        }
        document.write('<br>Sum is '+sum)
        if(n==sum){
            document.write('<br>It is armstrong no')
        } else {
            document.write('<br>It is not armstrong no')
        }
    </script>
</body>
</html>
